name: Generate Version File

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create commit file
        run: |
          echo "Commit Hash: ${{ github.sha }}" > commit_info.txt

      # Optional: If you want to commit this file back into the repo branch
      - name: Commit change back to repo
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add commit_info.txt
          git commit -m "chore: automated update of commit_info.txt [skip ci]" || echo "No changes to commit"
          git push